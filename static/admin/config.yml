backend:
  name: github
  repo: falcodeuy/falcode-web
  branch: main
  base_url: https://falcode.dev
  auth_endpoint: api/auth

publish_mode: editorial_workflow

site_url: https://falcode.dev

media_folder: "static/images/blog"
public_folder: "/images/blog"

# Blog author presets
blog_author_presets: &blog_author_presets
  - "Fausto Márquez"
  - "Crhistyan Silva"
  - "Leandro Paz"

collections:
  - name: "blog"
    label: "Blog Posts"
    folder: "content/blog"
    create: true
    slug: "{{slug}}"
    preview_path: "/{{fields.lang}}/blog/{{slug}}/"
    fields:
      - { label: "Title", name: "title", widget: "string" }
      - { label: "Date", name: "date", widget: "datetime" }
      - { label: "Updated At", name: "updatedAt", widget: "datetime", required: false }
      - { label: "Original Language", name: "lang", widget: "select", options: ["es", "en"], default: "en" }
      - { label: "Description", name: "description", widget: "text", required: false }
      - label: "Tags"
        name: "tags"
        widget: "list"
        required: false
        summary: "{{fields.tag}}"
        field:
          label: "Tag"
          name: "tag"
          widget: "select"
          options:
            - "AI"
            - "Architecture"
            - "Automation"
            - "Cloud"
            - "Cybersecurity"
            - "Data"
            - "DevOps"
            - "Mobile"
            - "Product"
            - "UI/UX"
            - "Web Development"
      - { label: "Featured Image", name: "featuredImage", widget: "image", required: false }
      - { label: "Body", name: "body", widget: "markdown" }
      - label: "Authors"
        name: "authors"
        widget: "list"
        required: false
        summary: "{{fields.author}}"
        field:
          label: "Author"
          name: "author"
          widget: "select"
          options: *blog_author_presets
      - label: "Credits & sources"
        name: "references"
        widget: "list"
        required: false
        fields:
          - { label: "Title", name: "title", widget: "string", required: true }
          - { label: "URL", name: "url", widget: "string", required: false }
          - { label: "Detail", name: "detail", widget: "text", required: false }
      - label: "Related posts"
        name: "relatedPosts"
        widget: "list"
        required: false
        hint: "Paste blog post URLs (e.g. /blog/my-post/)."
        label_singular: "related post"
        summary: "{{fields.slug}}"
        field:
          label: "Post URL"
          name: "slug"
          widget: "string"
